<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página con imagen y botón responsive</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
    }

    .hero {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #fff;
      margin: 0;
      padding: 0;
    }

    .image-wrapper {
      position: relative;
      width: 100%;
      line-height: 0;
      margin: 0;
    }

    .image-wrapper picture,
    .image-wrapper img {
      display: block;
      width: 100%;
      height: auto;
    }

    .hero-img {
      width: 100%;
      height: auto;
      display: block;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.16),
        rgba(0, 0, 0, 0.06),
        rgba(0, 0, 0, 0.10)
      );
      z-index: 1;
      pointer-events: none;
    }

    .content {
      position: absolute;
      left: 50%;
      top: 28%;
      transform: translate(-50%, -50%);
      z-index: 2;
      text-align: center;
      width: min(92%, 900px);
      padding: 20px;
      line-height: normal;
    }

    .content h1 {
      color: #fff;
      font-size: clamp(2rem, 5vw, 4.2rem);
      line-height: 1.08;
      margin-bottom: 12px;
      text-shadow: 0 3px 18px rgba(0, 0, 0, 0.45);
    }

    .content p {
      color: #fff;
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.5;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    }

    /* ESTILO BASE: tamaño, forma y comportamiento para TODOS */
    .floating-btn {
    position: absolute;
    right: 13%;
    bottom: 12%;
    z-index: 8;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 180px;
    padding: 28px 34px;
    background: #FF0000;
    color: #fff;
    text-decoration: none;
    font-size: 1.7rem;
    font-weight: 900;
    border-radius: 999px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
    transition: transform 0.25s ease, background 0.25s ease;
    line-height: normal;
    text-align: center;
    white-space: nowrap;
}

    .floating-btn:hover {
      background: #b80000;
      transform: scale(1.04);
    }

    .floating-btn:active {
      transform: scale(0.98);
    }

    /* SOLO COLOR */
    .floating-btn-blue {
      background: #0090E2;
      color: #fff;
    }

    .floating-btn-blue:hover {
      background: #0090E2;
    }

    .floating-btn-blue:active {
      background: #0090E2;
    }

    /* SOLO POSICIÓN */
    .btn-img-3 {
      right: 65%;
      bottom: 13%;
      left: auto;
    }

    @media (max-width: 1050px) {
      .floating-btn {
        right: 10%;
        bottom: 10%;
        min-width: 27%;
        padding: 15px 22px;
        font-size: 160%;
      }

      .content {
        width: min(92%, 760px);
      }

      .btn-img-3 {
         right: 60%;
        bottom: 10%;
        min-width: 27%;
        padding: 15px 22px;
        font-size: 160%;
      }
    }

    @media (max-width: 800px) {
      .content {
        width: 92%;
        padding: 10px 14px;
        top: 24%;
      }

      .content h1 {
        font-size: clamp(1.4rem, 6.6vw, 2.2rem);
        margin-bottom: 6px;
      }

      .content p {
        font-size: 0.82rem;
        line-height: 1.35;
      }

      /* MISMO TAMAÑO PARA TODOS LOS BOTONES */
      .floating-btn {
        left: 61%;
        bottom: 5%;
        min-width: unset;
        width: min(47%, 250px);
        padding: 11px 16px;
        font-size: 0.95rem;
      }

      /* BOTÓN DERECHO */
      .floating-btn:not(.btn-img-3) {
        bottom: 10%;
        width: min-content;
        left: 63%;
        right: auto;
        padding: 2%;
        transform: none;
        font-size: 84%;
      }

      .floating-btn:not(.btn-img-3):hover {
        transform: translateX(-50%) scale(1.03);
      }

      .floating-btn:not(.btn-img-3):active {
        transform: translateX(-50%) scale(0.98);
      }

      /* BOTÓN IZQUIERDO */
    .btn-img-3 {
      bottom: 10%;
        width: min-content;
        left: 10%;
        right: auto;
        padding: 2%;
        transform: none;
        font-size: 84%;
       
    }

      .btn-img-3:hover {
        transform: scale(1.03);
      }

      .btn-img-3:active {
        transform: scale(0.98);
      }
    }

    @media (max-width: 480px) {
      .content {
        width: 94%;
        padding: 8px 10px;
        top: 23%;
      }

      .content h1 {
        font-size: clamp(1.15rem, 6.8vw, 1.85rem);
      }

      .content p {
        font-size: 0.74rem;
      }

      /* MISMO ALTO Y ANCHO PARA AMBOS */
      .floating-btn {
        bottom: 12%;
        width: 31%;
        min-width: unset;
        font-size: 0.75rem;
        padding: 10px 14px;
      }

      .floating-btn:not(.btn-img-3) {
        bottom: 10%;
        width: min-content;
        left: 59%;
        right: auto;
        padding: 2%;
        transform: none;
        font-size: 84%;
      }

      .floating-btn:not(.btn-img-3):hover {
        transform: translateX(-50%) scale(1.03);
      }

      .floating-btn:not(.btn-img-3):active {
        transform: translateX(-50%) scale(0.98);
      }

      .btn-img-3 {
        bottom: 10%;
        left: 8%;
        right: auto;
        transform: none;
      }

      .btn-img-3:hover {
        transform: scale(1.03);
      }

      .btn-img-3:active {
        transform: scale(0.98);
      }
    }

    @media (max-width: 200px) {
      /* SIGUEN IGUALES EN TAMAÑO */
      .floating-btn {
        bottom: 5%;
        width: 34%;
        min-width: unset;
        padding: 9px 12px;
        font-size: 0.75rem;
      }

      .floating-btn:not(.btn-img-3) {
        left: 75%;
        right: auto;
        transform: translateX(-50%);
      }

      .btn-img-3 {
        left: 3%;
        right: auto;
        transform: none;
      }

      .floating-btn:not(.btn-img-3):hover {
        transform: translateX(-50%) scale(1.03);
      }

      .floating-btn:not(.btn-img-3):active {
        transform: translateX(-50%) scale(0.98);
      }

      .btn-img-3:hover {
        transform: scale(1.03);
      }

      .btn-img-3:active {
        transform: scale(0.98);
      }
    }
  </style>
</head>
<body>

  <section class="hero">
