<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página con imagen y botón responsive</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
    }

    .hero {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #fff;
      margin: 0;
      padding: 0;
    }

    .image-wrapper {
      position: relative;
      width: 100%;
      line-height: 0;
      margin: 0;
    }

    .image-wrapper picture,
    .image-wrapper img {
      display: block;
      width: 100%;
      height: auto;
    }

    .hero-img {
      width: 100%;
      height: auto;
      display: block;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.16),
        rgba(0, 0, 0, 0.06),
        rgba(0, 0, 0, 0.10)
      );
      z-index: 1;
      pointer-events: none;
    }

    .content {
      position: absolute;
      left: 50%;
      top: 28%;
      transform: translate(-50%, -50%);
      z-index: 2;
      text-align: center;
      width: min(92%, 900px);
      padding: 20px;
      line-height: normal;
    }

    .content h1 {
      color: #fff;
      font-size: clamp(2rem, 5vw, 4.2rem);
      line-height: 1.08;
      margin-bottom: 12px;
      text-shadow: 0 3px 18px rgba(0, 0, 0, 0.45);
    }

    .content p {
      color: #fff;
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.5;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    }

  .floating-btn {
    position: absolute;
    right: 13%;
    bottom: 18%;
    z-index: 8;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 180px;
    padding: 30px 34px;
    background: #d60000;
    color: #fff;
    text-decoration: none;
    font-size: 1.6rem;
    font-weight: 900;
    border-radius: 999px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
    transition: transform 0.25s ease, background 0.25s ease;
    line-height: normal;
}

.btn-img-3 {
  right: 65%;
  bottom: 18%;
}
    .floating-btn:hover {
      background: #b80000;
      transform: scale(1.04);
    }

    .floating-btn:active {
      transform: scale(0.98);
    }

    @media (max-width: 1024px) {
      .floating-btn {
        right: 6%;
        bottom: 5%;
        min-width: 170px;
        padding: 12px 22px;
      }

      .content {
        width: min(92%, 760px);
      }
    }

    @media (max-width: 768px) {
      .content {
        width: 92%;
        padding: 10px 14px;
        top: 24%;
      }

      .content h1 {
        font-size: clamp(1.4rem, 6.6vw, 2.2rem);
        margin-bottom: 6px;
      }

      .content p {
        font-size: 0.82rem;
        line-height: 1.35;
      }

      .floating-btn {
        left: 80%;
        right: auto;
        bottom: 5%;
        transform: translateX(-50%);
        width: min(40%, 260px);
        min-width: unset;
        padding: 11px 16px;
        font-size: 0.95rem;
      }

      .floating-btn:hover {
        transform: translateX(-50%) scale(1.03);
      }

      .floating-btn:active {
        transform: translateX(-50%) scale(0.98);
      }
    }

    @media (max-width: 480px) {
      .content {
        width: 94%;
        padding: 8px 10px;
        top: 23%;
      }

      .content h1 {
        font-size: clamp(1.15rem, 6.8vw, 1.85rem);
      }

      .content p {
        font-size: 0.74rem;
      }

    .floating-btn {
      left: 79%;
      right: 5%;
      font-size: 0.86rem;
      padding: 10px 14px;
    }
  }

  @media (max-width: 768px) {
    .btn-img-3 {
      right: 10%;
      bottom: 14%;
      left: 2%;
      transform: none;
      width: auto;
    }
  }

  @media (max-width: 480px) {
    .btn-img-3 {
      left: 3%;
      right: 64%;
      width: 40%;
      bottom: 5%;
    }
  }

  @media (max-width: 1024px) {
    .btn-img-3 {
      left: 3%;
      right: 64%;
      width: 40%;
      bottom: 5%;
    }
    /* más pequeño que 480 */
@media (max-width: 390px) {
  .btn-img-3 {
    right: 4%;
    bottom: 5%;
    padding: 9px 12px;
    font-size: 0.75rem;
    min-width: 110px;
  }
  @media (max-width: 390px) {

    right: 4%;
    bottom: 5%;
    padding: 9px 12px;
    font-size: 0.75rem;
    min-width: 110px;
  }
}
  }
}
</style>
